<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voxlbuilder</title>
  <meta name="description" content="Build planner for the Roblox game Voxlblade: equipment, upgrades, enchants and infusions.">
  <link rel="icon" href="assets/img/ench-legendary.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-tab">
      <span class="brand outline">VOXLBUILDER</span>
      <nav class="view-tabs" id="viewTabs" aria-label="Views"></nav>
      <span class="topbar-count outline" id="equipCount">0/9</span>
    </div>
  </header>

  <main class="inv">
    <section class="panel sand main-panel">
     <div class="view-inv" id="view-inv">
      <div class="char-col">
        <div class="who">
          <button class="pname outline" id="buildNameBtn" title="Rename build">My Build</button>
          <div class="lv outline">LV: <span id="charLevelLabel">80</span></div>
          <div class="char-badges" id="charBadges"></div>
        </div>
        <div class="cross" id="cross"></div>
        <div class="inf-wrap">
          <div class="inf-label outline">INFUSIONS</div>
          <div class="inf-row" id="infusions"></div>
        </div>
        <div class="loadouts" id="loadouts"></div>
        <div class="char-actions">
          <button class="txtbtn red outline" id="shareBtn">SHARE BUILD</button>
        </div>
      </div>

      <div class="mid-col">
        <div class="mid-head">
          <h2 class="slot-title outline" id="slotTitle">HELMET</h2>
          <div class="mode-tabs" id="modeTabs"></div>
        </div>
        <div class="forge dark" id="forge"></div>
        <div class="filters">
          <input class="search" id="search" type="search" placeholder="Search items, sets, perks…" autocomplete="off">
          <select id="sortStat" class="sort" title="Sort by stat"></select>
          <button class="favtoggle" id="favOnly" title="Show favorites only" aria-pressed="false">★</button>
        </div>
        <div class="grid dark" id="itemGrid" role="listbox" aria-label="Items"></div>
        <div class="actions">
          <button class="txtbtn green outline" id="equipBtn">EQUIP</button>
          <button class="txtbtn yellow outline" id="favBtn">FAVORITE</button>
          <button class="txtbtn red outline" id="destroyBtn">DESTROY</button>
        </div>
      </div>
     </div>
     <div class="view-char" id="view-char" hidden><div id="viewChar"></div></div>
     <div class="view-test" id="view-test" hidden><div id="viewTest"></div></div>
    </section>

    <aside class="right-col">
      <div class="panel stat-panel">
        <div class="stat-scroll" id="rightBody"></div>
      </div>
      <div class="panel desc-panel">
        <div class="desc-scroll" id="desc"></div>
      </div>
    </aside>

    <nav class="sidetabs" id="sidetabs" aria-label="Panels"></nav>
  </main>

  <footer class="credits outline">
    Item data and images from the <a href="https://voxlpedia.miraheze.org/wiki/Voxlblade_Wiki" target="_blank" rel="noopener">Voxlpedia wiki</a>
    · <span id="dataDate"></span> · Fan-made, not affiliated with Voxlblade.
  </footer>

  <div class="modal" id="enchantModal" hidden>
    <div class="modal-box panel sand" role="dialog" aria-modal="true" aria-labelledby="enchantTitle">
      <div class="modal-head">
        <h3 class="outline" id="enchantTitle">ENCHANT</h3>
        <button class="xbtn outline" id="enchantClose" aria-label="Close">X</button>
      </div>
      <div class="ench-cols outline"><span>DEFAULT</span><span>ASCENDED</span></div>
      <div class="ench-list dark" id="enchantList"></div>
      <div class="modal-foot">
        <button class="txtbtn red outline" id="enchantRemove">REMOVE ENCHANT</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data/data.js"></script>
  <script src="js/enchants.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/model.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/damage.js"></script>
  <script src="js/support.js"></script>
  <script src="js/views.js"></script>
  <script src="js/view-test.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
